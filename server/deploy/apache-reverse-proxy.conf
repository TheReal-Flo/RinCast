# Example Apache virtual host in front of the RinCast server. Replace rincast.example.com
# and the certificate paths. Needs mod_ssl, mod_proxy, mod_proxy_http and mod_headers.
# UDP 38720 (rendezvous) must reach the server directly: it can't go through Apache.

<VirtualHost *:443>
    ServerName rincast.example.com

    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/rincast.example.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/rincast.example.com/privkey.pem

    ProxyPreserveHost On
    ProxyRequests Off

    # Keep certificate renewals on Apache, if you use the HTTP-01 challenge.
    ProxyPass        /.well-known/acme-challenge/ !

    # PCs hold a long-poll open for ~25 s; the server allows 70 s per response.
    ProxyPass        / http://127.0.0.1:38080/ timeout=90 keepalive=On
    ProxyPassReverse / http://127.0.0.1:38080/

    RequestHeader set X-Forwarded-Proto "https"
</VirtualHost>
