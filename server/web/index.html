<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>RinCast</title>
  <link rel="icon" href="/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <a class="skip" href="#app">Skip to content</a>
  <header class="top">
    <a class="brand" href="/">
      <img src="/logo.svg" alt="" width="26" height="26">
      <span>RinCast</span>
    </a>
    <nav id="nav" aria-label="Main"></nav>
  </header>
  <main id="app" class="app" tabindex="-1"></main>
  <footer class="foot" id="foot"><span>Free, open-source PC streaming for your headset.</span></footer>
  <dialog id="confirm" aria-labelledby="confirmTitle" aria-describedby="confirmText">
    <h2 id="confirmTitle"></h2>
    <p id="confirmText"></p>
    <div class="actions">
      <button class="btn" id="confirmNo" autofocus>Cancel</button>
      <button class="btn danger" id="confirmYes"></button>
    </div>
  </dialog>
  <script src="/app.js" type="module"></script>
</body>
</html>
