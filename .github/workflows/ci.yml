name: CI

# Every commit on every branch, and every pull request. Tags don't count as commits here.
on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

# A newer commit on the same branch or pull request cancels the older run.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Streamer, SteamVR driver, tools, core tests
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S pc -B build\pc -G "Visual Studio 17 2022" -A x64 -DRINCAST_CORE_TESTS=ON
      - name: Build
        run: cmake --build build\pc --config Release --parallel
      - name: Core tests
        run: build\pc\bin\Release\rincast-core-tests.exe

  audio-driver:
    name: Audio driver
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: deps
          key: wdk-${{ hashFiles('scripts/fetch-deps.ps1') }}
      - name: Fetch the WDK
        run: powershell -ExecutionPolicy Bypass -File scripts\fetch-deps.ps1
      - name: Build
        run: |
          $wdk = (Get-ChildItem deps\packages -Directory -Filter 'Microsoft.Windows.WDK.x64.*' | Select-Object -Last 1).FullName
          cmake -S pc\audio-driver -B build\audio -G "Visual Studio 17 2022" -A x64 "-DWDK_ROOT=$wdk\c"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build\audio --config Release

  server:
    name: Server
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - run: go test ./...

  android:
    name: Headset app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install the NDK and CMake
        run: $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;27.3.13750724" "cmake;3.22.1"
      - name: Build
        working-directory: headset
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --console=plain
