name: CI

# Every commit on every branch, and every pull request. Tags don't count as commits here.
on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

# A newer commit on the same branch or pull request cancels the older run.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Streamer, SteamVR driver, tools, core tests
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5
      - name: Configure
        run: cmake -S pc -B build\pc -G "Visual Studio 17 2022" -A x64 -DRINCAST_CORE_TESTS=ON
      - name: Build
        run: cmake --build build\pc --config Release --parallel
      - name: Steam audio installer tests
        run: python scripts/test-steam-audio-install.py
      - name: Core tests
        run: build\pc\bin\Release\rincast-core-tests.exe
      - name: Controller tests
        run: build\pc\bin\Release\rincast-controller-tests.exe
      - name: Controller resource checks
        run: python scripts/validate-controller-resources.py

  monado-windows:
    name: Monado (Windows)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5
      # vcpkg builds Monado's dependencies (Eigen, glslang, the Vulkan loader); its binary cache
      # keeps that to the first run.
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}\vcpkg-cache
          key: vcpkg-monado-${{ hashFiles('pc/monado/vcpkg.json') }}
      - name: Build
        env:
          VCPKG_BINARY_SOURCES: clear;files,${{ runner.temp }}\vcpkg-cache,readwrite
        run: |
          New-Item -ItemType Directory -Force "${{ runner.temp }}\vcpkg-cache" | Out-Null
          cmake -S pc\monado -B build\monado -G "Visual Studio 17 2022" -A x64 "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT\scripts\buildsystems\vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=x64-windows
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build\monado --config Release --parallel --target rincast-monado

  audio-driver:
    name: Audio driver
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5
      - uses: actions/cache@v4
        with:
          path: deps
          key: wdk-${{ hashFiles('scripts/fetch-deps.ps1') }}
      - name: Fetch the WDK
        run: powershell -ExecutionPolicy Bypass -File scripts\fetch-deps.ps1
      - name: Build
        run: |
          $wdk = (Get-ChildItem deps\packages -Directory -Filter 'Microsoft.Windows.WDK.x64.*' | Select-Object -Last 1).FullName
          cmake -S pc\audio-driver -B build\audio -G "Visual Studio 17 2022" -A x64 "-DWDK_ROOT=$wdk\c"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build\audio --config Release

  server:
    name: Server
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - run: go test ./...

  android:
    name: Headset app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install the NDK and CMake
        run: $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;27.3.13750724" "cmake;3.22.1"
      - name: Build
        working-directory: headset
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --console=plain

  linux:
    name: Linux streamer
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      # The Linux streamer (docs/LINUX.md): the session, server, settings and account code the
      # Windows streamer shares with Linux and macOS, with the Linux platform parts. A change that
      # only compiles on Windows fails here, not later on someone's Linux PC or Mac.
      - name: Install the build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build pkg-config             libcurl4-openssl-dev libavcodec-dev libavutil-dev libavfilter-dev libswscale-dev libva-dev libdrm-dev             libx11-dev libxext-dev libxfixes-dev libxtst-dev libxrandr-dev libxdamage-dev             libglib2.0-dev libpipewire-0.3-dev libei-dev libwayland-dev libpulse-dev             libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev libvulkan-dev \
            libeigen3-dev libudev-dev glslang-tools python3
      - name: Build
        run: |
          cmake -S pc/linux -B build/linux -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build/linux
      # RinCast's Monado service and OpenXR runtime (pc/monado), Linux's PC VR.
      - name: Build Monado
        run: |
          cmake -S pc/monado -B build/monado -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build/monado --target rincast-monado

  macos:
    name: macOS streamer
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      # Build and package only. Capture / input injection need TCC consents a headless
      # runner can't grant, and hosted runners drop IPv6 link-local multicast, which
      # core_tests.cpp's discovery check requires. Both work with --test on a real Mac.
      - name: Build and package
        run: bash scripts/build-mac.sh
      - uses: actions/upload-artifact@v4
        with:
          name: RinCast-macos-universal
          path: dist/RinCast-*-macos-*.zip
          if-no-files-found: error
          retention-days: 7
