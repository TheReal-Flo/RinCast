name: Release

# Started by hand (Actions > Release > Run workflow), and only by the repository's owner.
# It reads the version from VERSION, builds everything from the chosen commit on main, tags
# that commit v<VERSION> and publishes the release with the matching CHANGELOG.md section as
# its notes.
#
# Repository secrets for a signed APK: RINCAST_KEYSTORE_BASE64, RINCAST_KEYSTORE_PASSWORD,
# RINCAST_KEY_ALIAS, RINCAST_KEY_PASSWORD (see docs/BUILDING.md). Without them the release
# stops, unless "Allow a debug-signed APK" is ticked.
on:
  workflow_dispatch:
    inputs:
      draft:
        description: 'Create a draft to publish by hand instead of publishing right away'
        type: boolean
        default: false
      allow_debug_apk:
        description: 'Allow a debug-signed APK when the signing secrets are missing'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.actor == github.repository_owner
    runs-on: windows-2022
    steps:
      - name: Check where it runs from
        if: github.ref != 'refs/heads/main'
        run: throw "Releases are made from main, not $env:GITHUB_REF."

      - uses: actions/checkout@v4

      - name: Read the version and check the tag is new
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content VERSION -TotalCount 1).Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "VERSION must be major.minor.patch, got '$version'" }
          $tag = "v$version"
          git ls-remote --exit-code --tags origin "refs/tags/$tag" | Out-Null
          if ($LASTEXITCODE -eq 0) { throw "$tag already exists. Raise the version in VERSION first." }
          $global:LASTEXITCODE = 0

          # The notes are this version's section of CHANGELOG.md, without its heading.
          $lines = Get-Content CHANGELOG.md
          $start = -1
          for ($i = 0; $i -lt $lines.Count; $i++) {
            if ($lines[$i] -match "^## $([regex]::Escape($version))(\s|$)") { $start = $i; break }
          }
          if ($start -lt 0) { throw "CHANGELOG.md has no '## $version' section." }
          if ($lines[$start] -match 'unreleased') { throw "CHANGELOG.md still says '$($lines[$start])'. Put the release date in." }
          $end = $lines.Count
          for ($i = $start + 1; $i -lt $lines.Count; $i++) { if ($lines[$i] -match '^## ') { $end = $i; break } }
          $notes = ($lines[($start + 1)..($end - 1)] -join "`n").Trim()
          Set-Content (Join-Path $env:RUNNER_TEMP 'notes.md') $notes -Encoding utf8

          Add-Content $env:GITHUB_ENV "RC_VERSION=$version"
          Add-Content $env:GITHUB_ENV "RC_TAG=$tag"

      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install the NDK and CMake
        run: |
          & "$env:ANDROID_HOME\cmdline-tools\latest\bin\sdkmanager.bat" --install "ndk;27.3.13750724" "cmake;3.22.1"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # The signing key and its passwords only exist in the two steps below that need them:
      # never in $GITHUB_ENV, never echoed, never under dist\ (which is what gets uploaded).
      # The key file sits in the runner's temp folder and is deleted at the end of the job,
      # whatever happens. GitHub masks the secrets' values in the log as well.
      - name: Decode the signing key, if there is one
        env:
          KEYSTORE_BASE64: ${{ secrets.RINCAST_KEYSTORE_BASE64 }}
          HAVE_PASSWORDS: ${{ secrets.RINCAST_KEYSTORE_PASSWORD != '' && secrets.RINCAST_KEY_ALIAS != '' && secrets.RINCAST_KEY_PASSWORD != '' }}
          ALLOW_DEBUG_APK: ${{ inputs.allow_debug_apk }}
        run: |
          if ($env:KEYSTORE_BASE64 -and $env:HAVE_PASSWORDS -eq 'true') {
            $path = Join-Path $env:RUNNER_TEMP 'rincast-release.keystore'
            # Line breaks or spaces from copying the text around aren't part of the key.
            $b64 = $env:KEYSTORE_BASE64 -replace '\s', ''
            try { $bytes = [Convert]::FromBase64String($b64) }
            catch { throw 'RINCAST_KEYSTORE_BASE64 is not valid base64. Upload it again (see docs/BUILDING.md).' }
            [IO.File]::WriteAllBytes($path, $bytes)
            # Only the file's location, which isn't secret.
            Add-Content $env:GITHUB_ENV "RINCAST_KEYSTORE=$path"
            Add-Content $env:GITHUB_ENV 'APK_SIGNED=true'
          } elseif ($env:ALLOW_DEBUG_APK -eq 'true') {
            Write-Host 'No signing secrets; the APK will be debug-signed.'
            Add-Content $env:GITHUB_ENV 'APK_SIGNED=false'
          } else {
            throw 'The signing secrets are missing. Add them, or run again with "Allow a debug-signed APK".'
          }

      - name: Build and package
        env:
          RINCAST_KEYSTORE_PASSWORD: ${{ env.APK_SIGNED == 'true' && secrets.RINCAST_KEYSTORE_PASSWORD || '' }}
          RINCAST_KEY_ALIAS: ${{ env.APK_SIGNED == 'true' && secrets.RINCAST_KEY_ALIAS || '' }}
          RINCAST_KEY_PASSWORD: ${{ env.APK_SIGNED == 'true' && secrets.RINCAST_KEY_PASSWORD || '' }}
        run: |
          $extra = if ($env:APK_SIGNED -eq 'true') { @() } else { @('-DebugApk') }
          powershell -ExecutionPolicy Bypass -File scripts\build-all.ps1 -Package -Skip audio @extra
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Delete the signing key
        if: always()
        run: |
          $path = Join-Path $env:RUNNER_TEMP 'rincast-release.keystore'
          if (Test-Path $path) { Remove-Item $path -Force }

      - name: Check what gets published
        run: |
          # Nothing secret may be among the uploads.
          $leaks = Get-ChildItem dist -Recurse -File | Where-Object { $_.Extension -in '.keystore', '.jks', '.p12', '.pfx' }
          if ($leaks) { throw "Signing material in dist: $($leaks.Name -join ', ')" }
          # A signed release must really be signed with the release key, not Android's debug key.
          if ($env:APK_SIGNED -eq 'true') {
            $apksigner = Get-ChildItem "$env:ANDROID_HOME\build-tools" -Directory | Sort-Object Name | Select-Object -Last 1
            foreach ($name in "RinCast-$env:RC_VERSION.apk", "RinCast-$env:RC_VERSION-quest1.apk") {
              $apk = Get-Item "dist\$name"
              $certs = & (Join-Path $apksigner.FullName 'apksigner.bat') verify --print-certs $apk.FullName
              if ($LASTEXITCODE -ne 0) { throw "$name's signature does not verify." }
              if ($certs -match 'Android Debug') { throw "$name is signed with the debug key." }
              "$name"; $certs | Select-String 'certificate DN|SHA-256'
            }
          }

      - name: Tag the commit and create the release
        env:
          GH_TOKEN: ${{ github.token }}
          DRAFT: ${{ inputs.draft }}
        run: |
          $files = @(
            Get-ChildItem "dist\RinCast-$env:RC_VERSION-*.zip", "dist\RinCast-$env:RC_VERSION-Setup.exe", "dist\RinCast-$env:RC_VERSION*.apk", "dist\rincast-server-$env:RC_VERSION-*"
            Get-Item dist\SHA256SUMS.txt, dist\LICENSE, dist\THIRD_PARTY_NOTICES.md
          ) | ForEach-Object { $_.FullName }
          $notes = Join-Path $env:RUNNER_TEMP 'notes.md'
          if ($env:APK_SIGNED -ne 'true') {
            Add-Content $notes "`n`nThe APK in this release is debug-signed."
          }
          $flags = @('--target', $env:GITHUB_SHA, '--title', "RinCast $env:RC_VERSION", '--notes-file', $notes)
          if ($env:DRAFT -eq 'true') { $flags += '--draft' }
          # Creating the release creates the tag on the commit that was built.
          gh release create $env:RC_TAG @flags @files
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
